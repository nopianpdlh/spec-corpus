name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run pack:corpus
      - run: node --test packages/corpus/test/release-manifest.schema.test.mjs packages/cli/test/install-record.schema.test.mjs packages/cli/test/cli-args.test.mjs packages/cli/test/status-contract.test.mjs
      - run: node --test packages/cli/test/e2e/bootstrap-empty.test.mjs packages/cli/test/e2e/verify-clean.test.mjs packages/cli/test/e2e/dirty-state.test.mjs packages/cli/test/e2e/update-clean.test.mjs packages/cli/test/e2e/update-force.test.mjs packages/cli/test/e2e/offline-tarball.test.mjs packages/cli/test/e2e/recovery.test.mjs packages/cli/test/e2e/invalid-version.test.mjs
      - run: npm run verify:release
